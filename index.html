<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}</style>
<title>Etch Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one wide app block per app (text beside a phone screenshot, stacked on phones), then a shared install-steps band. Palette follows the app's own deep blue with a cyan Wi-Fi accent. */
:root {
  --bg: #F2F5FB;
  --surface: #FFFFFF;
  --fg: #0B1B3F;
  --muted: #51607F;
  --line: #D9E1F0;
  --soft: #E6EDFC;
  --accent: #1B4FD8;
  --accent-ink: #FFFFFF;
  --cyan: #0A9CC9;
  --font-display: "Readex Pro", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Readex Pro", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081029;
    --surface: #0F1B3D;
    --fg: #E8EEFB;
    --muted: #9DB0D6;
    --line: #1E2E5A;
    --soft: #142450;
    --accent: #4F83FF;
    --accent-ink: #06122E;
    --cyan: #3DD6FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081029;
  --surface: #0F1B3D;
  --fg: #E8EEFB;
  --muted: #9DB0D6;
  --line: #1E2E5A;
  --soft: #142450;
  --accent: #4F83FF;
  --accent-ink: #06122E;
  --cyan: #3DD6FF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.75;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1040px; margin-inline: auto; display: flex; flex-direction: column; gap: 56px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.35; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; border-radius: 8px; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 15px; color: var(--muted); }
.brand svg { color: var(--cyan); flex: none; }
.lang {
  font: 600 14px/1 var(--font-display);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 18px;
  cursor: pointer;
  min-height: 40px;
}
.lang:hover { border-color: var(--accent); }

/* app block */
.app { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 40px; align-items: center; }
.app-text { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: 500 13px/1 var(--font-body);
  color: var(--accent);
  background: var(--soft);
  padding: 8px 12px;
  border-radius: 999px;
}
.app h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 700; }
.app h1 .name { color: var(--accent); }
.lead { color: var(--muted); font-size: 17px; max-width: 52ch; }
.cta-row { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: 600 18px/1 var(--font-display);
  color: var(--accent-ink);
  background: var(--accent);
  text-decoration: none;
  padding: 18px 28px;
  border-radius: 14px;
  min-height: 56px;
  transition: transform .15s ease, filter .15s ease;
}
.btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.note { font-size: 14px; color: var(--muted); max-width: 46ch; }

.app-media { position: relative; display: grid; place-items: center; min-width: 0; padding: 16px 0; }
.app-media::before {
  content: ""; position: absolute; inset: -6% -10%;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, var(--line) 46px 47px);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0 38%, transparent 70%);
  mask-image: radial-gradient(circle at 50% 50%, #000 0 38%, transparent 70%);
  pointer-events: none;
}
.app-media img {
  position: relative;
  width: min(100%, 340px);
  height: auto;
  aspect-ratio: 760 / 950;
  border-radius: 28px;
  border: 1px solid var(--line);
  box-shadow: 0 24px 60px -24px color-mix(in srgb, var(--accent) 55%, transparent);
}

/* features */
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 8px; grid-column: 1 / -1; }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.feat h3 { font-size: 17px; font-weight: 600; }
.feat p { color: var(--muted); font-size: 15px; }

/* install steps */
.steps-band { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 28px; }
.steps-band h2 { font-size: clamp(22px, 5vw, 28px); font-weight: 600; }
.steps-band .sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: s; min-width: 0; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; align-items: start; }
ol.steps li::before {
  content: counter(s);
  display: grid; place-items: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--soft); color: var(--accent);
  font: 600 15px/1 var(--font-display);
}
ol.steps li p { padding-top: 5px; }

footer { color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 760px) {
  .wrap { gap: 40px; }
  .app { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .steps-band { grid-template-columns: minmax(0, 1fr); padding: 22px; }
  .btn { width: 100%; }
  .cta-row { align-items: stretch; }
}
@media (prefers-reduced-motion: reduce) {
  .btn { transition: none; }
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0"/><path d="M5.5 12.4a10 10 0 0 1 13 0"/><path d="M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>
      <span id="siteLabel"></span>
    </div>
    <button class="lang" id="langBtn" type="button"></button>
  </header>

  <main id="apps" class="wrap" style="gap:56px"></main>

  <section class="steps-band" aria-labelledby="stepsTitle">
    <div>
      <h2 id="stepsTitle"></h2>
      <p class="sub" id="stepsSub"></p>
    </div>
    <ol class="steps" id="steps"></ol>
  </section>

  <footer id="foot"></footer>
</div>

    chips: ["Android", "APK file", "Hosted on Google Drive"],
    dl: "Download the app",
    dlNote: "The button opens the file on Google Drive. Tap download there.",
    stepsTitle: "How to install",
    stepsSub: "The app comes as an APK file, so installing takes two steps more than an app store.",
    steps: [
      "Tap “Download the app” and the file opens on Google Drive.",
      "Tap the download icon. If a message says the file was not scanned, choose “Download anyway”.",
      "Open the file from your downloads. If the phone asks to allow installs from this source, turn it on for your browser or Drive.",
      "Tap “Install”, then open the app. Devices that share with each other need to be on the same Wi-Fi network."
    ],
    foot: "App files are hosted on Google Drive."
  }
};

var lang = "ar";
try { var saved = localStorage.getItem("etch-lang"); if (saved === "ar" || saved === "en") lang = saved; } catch (e) {}

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render() {
  var u = UI[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("siteLabel").textContent = u.site;
  document.getElementById("langBtn").textContent = u.toggle;
  document.getElementById("stepsTitle").textContent = u.stepsTitle;
  document.getElementById("stepsSub").textContent = u.stepsSub;
  document.getElementById("foot").textContent = u.foot;
  document.getElementById("steps").innerHTML = u.steps.map(function (s) { return "<li><p>" + esc(s) + "</p></li>"; }).join("");

  document.getElementById("apps").innerHTML = APPS.map(function (a, i) {
    var t = a[lang];
    var heading = i === 0 ? "h1" : "h2";
    var chips = [t.tag].concat(u.chips).map(function (c) { return '<span class="chip">' + esc(c) + "</span>"; }).join("");
    var feats = t.features.map(function (f) { return '<div class="feat"><h3>' + esc(f.t) + "</h3><p>" + esc(f.d) + "</p></div>"; }).join("");
    return '<article class="app" id="' + esc(a.id) + '">' +
      '<div class="app-text">' +
        '<div class="chips">' + chips + "</div>" +
        "<" + heading + '><span class="name">' + esc(a.name) + "</span><br>" + esc(t.lead1) + '<span class="name">' + esc(t.leadName) + "</span>" + esc(t.lead2) + "</" + heading + ">" +
        '<p class="lead">' + esc(t.desc) + "</p>" +
        '<div class="cta-row">' +
          '<a class="btn" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
            '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>' +
            "<span>" + esc(u.dl) + "</span></a>" +
          '<p class="note">' + esc(u.dlNote) + "</p>" +
        "</div>" +
      "</div>" +
      '<div class="app-media"><img src="' + esc(a.img) + '" width="760" height="950" alt="' + esc(t.alt) + '"></div>' +
      '<div class="features">' + feats + "</div>" +
    "</article>";
  }).join("");
}

document.getElementById("langBtn").addEventListener("click", function () {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("etch-lang", lang); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
